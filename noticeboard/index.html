<!DOCTYPE html>

<html lang="zh-cn" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>公告栏-Sudle</title>
    <script src="https://cdn.sudle2008.top/js/global.js"></script>
</head>
<body>
    <header id="header"></header>

    <div id="main">
        <p><h2>Sudle的公告栏</h2></p>

        <div id="board" style="display:flex; flex-direction:column;">
            <notice-news level="置顶" heading="关于本站" content="自用，建着玩的。用来熟悉各种网站操作和特性的。"></notice-news>
            <notice-news level="更新" heading="261005更新" content="成功将原先因clawcloud免费服务器关闭而关闭的alist网盘复活并迁移至openlist网盘。网盘主体服务已恢复运行，但部分功能无法正常使用，待进一步调试。目前采用cloudflare worker方式挂载，在可预见的周期内应该可以保持运行。"></notice-news>
            <notice-news level="更新" heading="250920更新" content="增加了告示板（即本页面），以后告示在此不定期更新。告示板目前与首页共用一个仓库并与其余页面隔离，以此保障在其他功能页面无法服务时告示板的可达性。"></notice-news>
        </div>
    </div>
    
    <footer id="footer"></footer>
    
    <script>
        class news extends HTMLElement {
            constructor() {
                super();
            }
            connectedCallback() {
                const level = this.getAttribute('level') || '';
                const heading = this.getAttribute('heading') || '（无标题）';
                const content = this.getAttribute('content') || '（无内容）';

                this.innerHTML = `
                    <div>
                        <div>
                            <h3 style="display: inline;float: left;margin-top: 0;">${heading}</h3>
                            <p style="opacity: 0.7;float: right;margin-top: 0;">${level}</p>
                            <p style="clear: both;">${content}</p>
                        </div>
                    </div>
                    <hr>
                `;
            }
        }
        customElements.define('notice-news', news);
    </script>
</body>
</html>
